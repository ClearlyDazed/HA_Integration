name: Validate with hassfest

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run hassfest
        run: docker run --rm -v ${{ github.ClearlyDazed/Legacy_SamsungTV/tree/2025.1/legacy_samsungtv }}/custom_components:/workdir/custom_components ghcr.io/home-assistant/hassfest
